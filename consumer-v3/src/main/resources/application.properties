# RabbitMQ
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest

# Consumer
consumer.thread.count=20
consumer.prefetch.count=50
room.count=20
persist.queue.capacity=200000
stats.queue.capacity=200000

# DB
db.url=jdbc:postgresql://localhost:5432/chatflow
db.username=chatflow
db.password=chatflow
db.pool.max.size=30

# Broadcast back to server-v2
broadcast.server.base.url=http://localhost:8082
broadcast.queue.capacity=200000
broadcast.batch.size=50
broadcast.flush.interval.ms=25

# Write behind
db.writer.thread.count=4
stats.writer.thread.count=2
db.batch.size=1000
db.flush.interval.ms=500
db.retry.max=3
db.retry.base.ms=200
db.circuit.breaker.failure.threshold=5
db.circuit.breaker.open.ms=5000
